# transHelper 配置。第一次运行且同目录没有这个文件时，程序会自动创建。
# 托盘图标右键「设置…」可以修改模型地址、模型名称、密钥和超时。
# 含有密钥，不会进入 Git。程序写回配置时会重写本文件，手写的注释不会保留。

[model]
# OpenAI 兼容接口的地址，末尾的 /v1 要保留。
base_url = {{ toml .BaseURL }}
model = {{ toml .Model }}
# 不需要密钥时留空。
api_key = {{ toml .APIKey }}
# 单次翻译的超时，单位秒。超时后不改动输入框。
timeout_seconds = {{ seconds .Timeout }}
temperature = {{ temp .Temperature }}
# 留空则使用程序内置的提示词。
system_prompt = {{ toml .SystemPrompt }}

[hotkeys]
# 至少带 Ctrl、Alt、Win 中的一个，避免影响正常打字。
# translate_and_send：翻译后替换输入框内容并回车发送。
# translate_only：只替换输入框内容，不发送。
translate_and_send = {{ toml .TranslateAndSend.String }}
translate_only = {{ toml .TranslateOnly.String }}

[target]
# 只有这些进程在前台时热键才生效。不区分大小写。
# ms-teams.exe 是新版 Teams，Teams.exe 是经典版。
processes = [{{ range $i, $name := .Processes }}{{ if $i }}, {{ end }}{{ toml $name }}{{ end }}]

[update]
# 为 true 时定期检查 GitHub Release。默认 false。
auto_check = {{ if .AutoCheckUpdate }}true{{ else }}false{{ end }}
